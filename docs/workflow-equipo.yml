name: sTEAMdistics

on:
  push:
    tags: ['*']

permissions: {}

jobs:
  notificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notificar tag
        env:
          GH_TOKEN: ${{ secrets.STEAMDISTICS_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run analizar.yml -R <org>/sTEAMdistics -f repo="$GITHUB_REPOSITORY" -f tag="$TAG"
